name: Curator — Opencode Headless (experimental)

on:
  schedule:
    - cron: '17 2 * * *'  # daily 02:17 UTC, staggered from track/discover
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - 'scripts/curate.mjs'
      - '.opencode/agent/curator.md'
      - '.github/workflows/curator.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: curator-${{ github.event_name }}-${{ github.event.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  curate:
    # Guard: schedule/dispatch/push/issues/pull_request run unconditionally (except bots);
    # issue_comment only runs when comment contains /curator and actor is OWNER/MEMBER/COLLABORATOR
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        github.event_name == 'push' &&
        !endsWith(github.actor, '[bot]')
      ) ||
      (
        github.event_name == 'issues' &&
        !endsWith(github.actor, '[bot]')
      ) ||
      (
        github.event_name == 'pull_request' &&
        !endsWith(github.actor, '[bot]')
      ) ||
      (
        github.event_name == 'issue_comment' &&
        !endsWith(github.actor, '[bot]') &&
        contains(github.event.comment.body, '/curator') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout (PR comment)
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Checkout (default)
        if: github.event_name != 'issue_comment' || !github.event.issue.pull_request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install opencode
        run: |
          set -e
          if npm install -g opencode-ai 2>&1 | tail -n 5; then
            echo "opencode via npm done"
          else
            curl -fsSL https://opencode.ai/install | bash
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi
          opencode --version || echo "opencode not found, fallback deterministic"
          echo "--- zen models preview ---"
          curl -s https://opencode.ai/zen/v1/models | head -c 800 || true
          echo ""

      - name: Run curator (free-model traversal)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PR: ${{ github.event.number || '' }}
          GH_ISSUE: ${{ github.event.issue.number || '' }}
          GH_COMMENT_PR: ${{ github.event.issue.number || '' }}
          GH_COMMENT_IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          GH_COMMENT_BODY: ${{ github.event.comment.body || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          echo "Event: ${{ github.event_name }} PR=${{ github.event.number }} Issue=${{ github.event.issue.number }} CommentIsPR=${{ github.event.issue.pull_request && 'true' || 'false' }}"
          # Resolve effective PR/ISSUE for issue_comment on PR:
          # - issue_comment on PR: GH_PR empty, GH_ISSUE == PR number, GH_COMMENT_IS_PR == true → treat as PR
          # - issue_comment on Issue: GH_COMMENT_IS_PR == false → treat as Issue
          # Export resolved vars for curate.mjs (it also has internal fallback)
          if [ "${{ github.event_name }}" = "issue_comment" ] && [ "${{ github.event.issue.pull_request && 'true' || 'false' }}" = "true" ]; then
            export GH_PR="${{ github.event.issue.number }}"
            export GH_ISSUE=""
            echo "Resolved issue_comment on PR → GH_PR=$GH_PR"
          fi
          node scripts/curate.mjs
          echo "--- curator-report preview ---"
          head -n 150 curator-report.md || true
          echo "--- .curate-prompt preview ---"
          head -n 40 .curate-prompt.md 2>/dev/null || true

      - name: Comment on PR/Issue if report changed
        if: github.event_name == 'pull_request' || github.event_name == 'issues' || github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f curator-report.md ]; then exit 0; fi
          # Post report as comment (truncated to 6000 chars)
          BODY=$(head -c 6000 curator-report.md)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment ${{ github.event.number }} --body "$BODY" || echo "pr comment failed"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            gh issue comment ${{ github.event.issue.number }} --body "$BODY" || echo "issue comment failed"
          else
            gh issue comment ${{ github.event.issue.number }} --body "$BODY" || echo "issue comment failed"
          fi

      - name: Create PR if report changed on schedule/dispatch/push
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(curator): AI draft report for review [skip ci]"
          branch: curator/report-${{ github.run_id }}
          delete-branch: true
          title: "chore(curator): AI draft — ${{ github.run_number }}"
          body: |
            **Experimental headless curator — needs human review before merge**

            - Generated by `scripts/curate.mjs` with **free-model traversal** (live Zen `/v1/models` → `opencode/<id>` fallback, latest-first).
            - Provider: `opencode` via `https://opencode.ai/zen/v1` with `apiKey: public` (no key required, auto-rotates if a free model expires).
            - Prompt: `.curate-prompt.md` (see Action logs, not committed)
            - Report: `curator-report.md`
            - **Do not auto-merge**: verify star counts, links, and any proposed patches.

            Triggered on `${{ github.event_name }}`. Close if no actionable findings.
          add-paths: |
            curator-report.md
          labels: |
            ai-draft
            needs-review

      - name: Handle PR permission fallback
        if: steps.cpr.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        run: |
          echo "::warning::PR creation blocked — enable 'Allow GitHub Actions to create and approve PRs' at https://github.com/organizations/awesome-deepseekharness/settings/actions"
          git ls-remote --heads origin curator/report-${{ github.run_id }} | head -n 5 || true

      - name: Summary
        if: always()
        run: |
          echo "Curator run done."
          ls -lh curator-report.md .curate-prompt.md 2>&1 | head -n 20
          echo "To test locally: npm i -g opencode-ai && node scripts/curate.mjs"

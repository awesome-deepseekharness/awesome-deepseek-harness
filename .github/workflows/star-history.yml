name: Star History

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6h, refreshes time axis and picks up unstars
  watch:
    types: [started]       # refresh shortly after a new star
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Render charts locally only (commit:false) — main is protected
      # (requires PR + `curate` check + CODEOWNERS approval), direct push always fails with GH006.
      # We open a PR via create-pull-request instead; triage fast-path gives `curate` ✅.
      - id: render
        uses: narayann7/star-history-action@v1
        with:
          repos: ${{ github.repository }}
          commit: false
          # output-dir, themes, etc. keep defaults: assets/star-history/star-history-{light,dark}.svg + png
          # token defaults to github.token which works for own repo; if 403, supply PAT via token: ${{ secrets.STAR_HISTORY_TOKEN }}

      - name: Sync embed to README.zh.md (action only updates README.md)
        if: steps.render.outputs.changed == 'true'
        run: |
          set -e
          # action updated README.md between <!-- star-history:start/end --> markers;
          # mirror the same <picture> block into README.zh.md so both languages stay in sync.
          python3 - <<'PY'
          import re
          def extract(p):
              t = open(p, encoding='utf-8').read()
              m = re.search(r'<!-- star-history:start -->.*?<!-- star-history:end -->', t, re.S)
              return m.group(0) if m else None
          try:
              block = extract('README.md')
              if not block:
                  print('no block in README.md, skip zh sync')
              else:
                  zh = open('README.zh.md', encoding='utf-8').read()
                  if '<!-- star-history:start -->' in zh and '<!-- star-history:end -->' in zh:
                      new_zh = re.sub(r'<!-- star-history:start -->.*?<!-- star-history:end -->', lambda _: block, zh, count=1, flags=re.S)
                      open('README.zh.md', 'w', encoding='utf-8').write(new_zh)
                      print('synced README.zh.md embed')
                  else:
                      print('zh markers (colon form) not found, skip')
          except FileNotFoundError as e:
              print(f'skip zh sync: {e}')
          PY

      - name: Open PR for star-history update (only when chart changed)
        id: cpr
        if: steps.render.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update star history"
          branch: bot/star-history
          delete-branch: true
          title: "chore: update star history"
          body: |
            🤖 **Star-history bot update** (low-risk, assets only)

            - Generated by `narayann7/star-history-action` (rendered locally, `commit: false`)
            - Files: `assets/star-history/*` + README embed (`<!-- star-history:start/end -->`)
            - Trigger: `${{ github.event_name }}` — only opens a PR when the chart actually changed (`changed == true`), not every 6h
            - Why PR, not direct push: `main` is protected (requires PR + `curate` check + CODEOWNERS review); direct push fails with `GH006`
            - `curate` check: provided by `curator-triage.yml` fast-path for `bot/star-history*` (no AI, auto-pass + `bot` label)
            - Maintainer: merge when green. No `[skip ci]` on purpose so required checks run.

            <!-- star-history-bot: triage fast-path will label + pass -->
          add-paths: |
            assets/star-history
            README.md
            README.zh.md
          labels: |
            bot
            documentation
            auto-labeled
            needs-review

      - name: Enable auto-merge (waits for `curate` ✅ + CODEOWNERS approval)
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          echo "Star-history PR #$PR created/updated — enabling auto-merge (squash)"
          gh pr merge "$PR" --auto --squash || echo "auto-merge not enabled (needs approval/checks first) — maintainer please approve when green"

      - name: No change — nothing to do
        if: steps.render.outputs.changed != 'true'
        run: echo "Star chart unchanged — no PR needed."
